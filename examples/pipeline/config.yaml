# ============================================================================
# Supervision Pipeline Configuration
# ============================================================================
# Configuration file for pipeline examples demonstrating object detection,
# tracking, line crossing, and ROI-based processing.

# ----------------------------------------------------------------------------
# Site & Camera Identification
# ----------------------------------------------------------------------------
site_id: supervision_demo      # Site identifier
camera_id: cam_01              # Unique camera identifier

# ----------------------------------------------------------------------------
# Video Source Configuration
# ----------------------------------------------------------------------------
video:
  # Source input (automatically detected based on format):
  #   - RTSP/HTTP streams: rtsp://... or http://...
  #   - Video files:       /path/to/video.mp4
  #   - Webcam:            0 (or 1, 2, etc.)
  # input: 0
  input: D:/Trabajo/src/CV/ball_counter/assets/Quilicura_V_20240801_132852_720p.mp4
  # input: rtsp://localhost:8554/mi_camara
  # input: rtsp://192.168.18.169:554/live1s3.sdp

  # Fallback FPS when unable to read from source (1-120)
  fallback_fps: 30

  # Fallback resolution [width, height] when unable to read from source
  fallback_resolution: [1920, 1080]

# ----------------------------------------------------------------------------
# Detector Configuration
# ----------------------------------------------------------------------------
detector:
  # Path to YOLO model (.pt file for PyTorch, .engine for TensorRT)
  # model_path: yolov8n.pt
  model_path: D:/Trabajo/src/CV/ball_counter/models/ball_detector_yolov11n_v4n_rf.pt


  # Confidence threshold for detections (0.0 - 1.0)
  # Higher values = fewer detections but more confident
  confidence_threshold: 0.4

  # IOU threshold for NMS (0.0 - 1.0)
  iou_threshold: 0.45

  # Device for inference: "cuda" (GPU) or "cpu"
  device: cuda

# ----------------------------------------------------------------------------
# Regions of Interest (ROIs)
# ----------------------------------------------------------------------------
# Define rectangular regions for focused detection
# Multiple ROIs can be defined, each with unique ID
rois:
  - id: roi_1
    x: 320       # X coordinate of top-left corner
    y: 20        # Y coordinate of top-left corner
    w: 640       # Width of rectangle
    h: 640       # Height of rectangle
    enabled: true

# ----------------------------------------------------------------------------
# Parallel Detection Pool Configuration
# ----------------------------------------------------------------------------
# For PoolYOLODetectionStep - parallel processing with multiple workers
pool:
  # Number of parallel detector workers (2-8 recommended)
  pool_size: 10

  # Maximum frames to queue for processing
  queue_size: 120

# ----------------------------------------------------------------------------
# Object Tracker Configuration
# ----------------------------------------------------------------------------
# Choose tracker type and configure its specific parameters
tracker:
  # Tracker type: "bytetrack", "sort", or "centroid"
  # - bytetrack: Advanced tracker with Kalman + score fusion (best for crowded scenes)
  # - sort: Simple Online Realtime Tracking with Kalman (fast and reliable)
  # - centroid: Centroid-based tracking with Euclidean distance (fastest, simple scenes)
  type: bytetrack

  # ByteTrack parameters (used when type: bytetrack)
  bytetrack:
    # Confidence threshold to activate a new track (0.0 - 1.0)
    track_activation_threshold: 0.25

    # Frames to buffer after losing a track
    lost_track_buffer: 30

    # Minimum threshold for matching between frames (0.0 - 1.0)
    # Higher values improve accuracy but risk fragmentation
    minimum_matching_threshold: 0.8

    # Consecutive frames required to confirm a track
    minimum_consecutive_frames: 1

  # SORT parameters (used when type: sort)
  sort:
    # Frames to buffer after losing a track
    lost_track_buffer: 30

    # Consecutive frames required to confirm a track
    minimum_consecutive_frames: 3

    # Minimum IoU for matching detections to tracks (0.0 - 1.0)
    # Higher values require more overlap
    iou_threshold: 0.3

  # Centroid parameters (used when type: centroid)
  centroid:
    # Frames to buffer after losing a track
    lost_track_buffer: 30

    # Maximum Euclidean distance in pixels for associating detections to tracks
    max_distance: 50.0

# ----------------------------------------------------------------------------
# Counting Lines Configuration
# ----------------------------------------------------------------------------
# Virtual lines for detecting crossings and counting objects
counting_lines:
  - id: line_1
    start: [640, 0]             # Start point [x, y]
    end: [640, 720]             # End point [x, y]
    direction: bidirectional    # "up", "down", "bidirectional"
    enabled: true

# ----------------------------------------------------------------------------
# Line Visualization Configuration
# ----------------------------------------------------------------------------
line_visualization:
  color: white        # Color name or hex (#RRGGBB)
  thickness: 4        # Line thickness in pixels
  # in_text: "IN"     # Custom label for IN count (optional)
  # out_text: "OUT"   # Custom label for OUT count (optional)

# ----------------------------------------------------------------------------
# Display Configuration
# ----------------------------------------------------------------------------
display:
  # Enable display window
  # IMPORTANT: Set to false for production/headless systems
  enabled: true

  # Custom window name (null = auto-generated)
  window_name: null

  # Show detailed metrics overlay on video
  show_metrics: true

  # Metrics overlay configuration (when show_metrics: true)
  metrics:
    # Position of metrics overlay
    # Options: "top-left", "top-right", "bottom-left", "bottom-right"
    position: top-left

    # Font scale for metrics text (0.3 - 1.0)
    font_scale: 0.5

    # Text color in BGR format [B, G, R]
    # Examples: [0, 255, 0]=green, [255, 255, 0]=cyan, [0, 0, 255]=red
    color: [0, 255, 0]

    # Background opacity (0.0=transparent, 1.0=opaque)
    background_opacity: 0.6

    # Which metrics to display
    show_fps: true
    show_detections: true
    show_tracked: true
    show_line_counts: true
    show_roi_info: true
    show_inference_time: true
    show_tracking_time: true
    show_pool_metrics: false

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  # Socket port for real-time event streaming (DebugLoggerStep)
  socket_port: 7777

  # Log file path for events
  log_file: count.log

  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO

  # Log directory for file outputs
  log_dir: ./temp/logs

# ----------------------------------------------------------------------------
# Output Configuration (optional)
# ----------------------------------------------------------------------------
output:
  # Enable video recording
  enabled: false

  # Output video file path (e.g., output.mp4, result.avi)
  file_path: output.mp4

  # Video codec FOURCC code
  # Options: "mp4v", "xvid", "h264", "h265"
  codec: xvid
