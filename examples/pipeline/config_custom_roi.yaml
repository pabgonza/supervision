# ROI-based Pool Detection - Custom ROI Position Example
# =======================================================
# This configuration demonstrates using a custom positioned ROI
# (not centered) for monitoring a specific area

# Video Source Configuration
# --------------------------
source: stream
input: rtsp://192.168.18.169:554/live1s3.sdp

# Detection Model Configuration
# -----------------------------
model: D:/Trabajo/src/CV/ball_counter/models/ball_detector_yolov11n_v4n_rf.pt
device: cuda
conf: 0.4

# ROI (Region of Interest) Configuration
# --------------------------------------
# Custom positioned ROI at specific coordinates
# Example: Monitor bottom-right quadrant of frame
roi:
  x: 960   # Fixed X position (for 1920px wide frame = right half)
  y: 540   # Fixed Y position (for 1080px tall frame = bottom half)
  width: 640   # Width of ROI
  height: 640  # Height of ROI

# Parallel Detection Pool Configuration
# -------------------------------------
pool_size: 4
queue_size: 10

# Tracking Configuration
# ----------------------
track_threshold: 0.25
lost_buffer: 30
match_threshold: 0.8

# Line Zone Configuration
# -----------------------
# Line positioned within the custom ROI area
# Note: Coordinates are in FULL FRAME space, not relative to ROI
line_start: "1280,540"  # Vertical line through center of ROI
line_end: "1280,1080"

# Line Visualization
# ------------------
line_color: white
line_thickness: 4

# Logging Configuration
# ---------------------
socket_port: 7777
log_file: count.log

# Display Configuration
# ---------------------
show_metrics: true

# Notes:
# - ROI will be drawn as cyan rectangle on frame
# - Detections only occur within ROI
# - Line counting works with full frame coordinates
# - This setup is ideal for monitoring entry/exit in specific zones
